<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Achievements | HabitFlow</title>

    <!-- Base -->
    <link rel="stylesheet" href="css/base/reset.css">
    <link rel="stylesheet" href="css/base/root.css">

    <!-- Global -->
    <link rel="stylesheet" href="css/global.css">

    <!-- Navigation -->
    <link rel="stylesheet" href="css/components/navigation.css">
    <!-- Page -->
    <link rel="stylesheet" href="css/pages/achievements.css">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>


<body>

    <!-- =========================================================
         ACHIEVEMENTS PAGE
    ========================================================== -->

    <main class="achievements-page">

        <!-- =========================================================
         ACHIEVEMENTS HEADER
    ========================================================== -->

        <section class="achievements-header">

            <div class="achievements-header-content">

                <div class="achievements-title-icon">
                    <span class="material-symbols-rounded">
                        emoji_events
                    </span>
                </div>

                <div class="achievements-title-text">

                    <h1>Achievements</h1>

                    <p>
                        Celebrate your progress and every milestone along the way.
                    </p>

                </div>

            </div>


            <!-- Streaksaur -->
            <div class="achievements-header-avatar">

                <img src="img/streakasaur-hero.png" alt="Streaksaur">

            </div>

        </section>

        <!-- =========================================================
         ACHIEVEMENT SUMMARY
    ========================================================== -->

        <section class="achievement-summary">

            <!-- Unlocked -->
            <div class="achievement-summary-item">

                <div class="summary-icon summary-unlocked">
                    <span class="material-symbols-rounded">
                        workspace_premium
                    </span>
                </div>

                <div class="summary-info">
                    <strong>0</strong>
                    <span>Unlocked</span>
                </div>

            </div>


            <div class="summary-divider"></div>


            <!-- Locked -->
            <div class="achievement-summary-item">

                <div class="summary-icon summary-locked">
                    <span class="material-symbols-rounded">
                        lock
                    </span>
                </div>

                <div class="summary-info">
                    <strong>0</strong>
                    <span>Locked</span>
                </div>

            </div>


            <div class="summary-divider"></div>


            <!-- Points -->
            <div class="achievement-summary-item">

                <div class="summary-icon summary-points">
                    <span class="material-symbols-rounded">
                        diamond
                    </span>
                </div>

                <div class="summary-info">
                    <strong>0</strong>
                    <span>Points</span>
                </div>

            </div>


            <div class="summary-divider"></div>


            <!-- Best Streak -->
            <div class="achievement-summary-item">

                <div class="summary-icon summary-streak">
                    <span class="material-symbols-rounded">
                        local_fire_department
                    </span>
                </div>

                <div class="summary-info">
                    <strong>0</strong>
                    <span>Best Streak</span>
                </div>

            </div>

        </section>

        <!-- =========================================================
         ACHIEVEMENT COLLECTION
    ========================================================== -->

        <section class="achievement-collection">

            <div class="achievement-section-header">

                <div>
                    <h2>Your Achievements</h2>

                    <p>
                        Keep building your streak to unlock new milestones.
                    </p>
                </div>

                <div class="achievement-progress">
                    <span>0 / 12</span>
                    <small>unlocked</small>
                </div>

            </div>

        </section>

    </main>


    <!-- =========================================================
         CORE
    ========================================================== -->

    <script src="js/core/storage.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/protect.js"></script>


    <!-- =========================================================
         SHARED
    ========================================================== -->

    <script src="js/shared/profile-utils.js"></script>
    <script src="js/shared/navigation.js"></script>

</body>

</html>
